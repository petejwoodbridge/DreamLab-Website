  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0f; }
    #news-frame {
      position: fixed;

      position: fixed;
      inset: 0;

  <!-- JSON-LD: Breadcrumb -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",

  <!-- JSON-LD: Periodical -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Periodical",
    "name": "Dream Machine — Creative AI Newsletter",
    "description": "dreamlab's essential reading on creative AI, real-time computing and immersive technology across film, content, games, advertising, music and art.",
    "url": "https://dreamlab.org.uk/newsletter/",

  }

</head>
<body>
  <!-- Loading splash (shown until the frame loads or we redirect) -->
  <div id="news-fallback">
    <p>Opening the Dream Machine newsletter…</p>
    <p>If it doesn't appear, <a href="https://www.linkedin.com/newsletters/dream-machine-creative-ai-7379776527871381505/">read it on LinkedIn</a>.</p>
  </div>

  <iframe
    id="news-frame"
    src="https://www.linkedin.com/newsletters/dream-machine-creative-ai-7379776527871381505/"
    title="Dream Machine — Creative AI Newsletter"
    loading="eager"></iframe>

  <script>
    // LinkedIn disallows framing (X-Frame-Options: DENY), so the iframe will
    // usually stay blank. If it hasn't loaded shortly, send the visitor on to
    // the real newsletter rather than leaving them on a blank page.
    (function () {
      var frame = document.getElementById('news-frame');
      var target = 'https://www.linkedin.com/newsletters/dream-machine-creative-ai-7379776527871381505/';
      var loaded = false;
      frame.addEventListener('load', function () {
        loaded = true;
        document.getElementById('news-fallback').style.display = 'none';
      });
      setTimeout(function () {
        if (!loaded) window.location.replace(target);
      }, 2500);
    })();
  </script>
</body>
